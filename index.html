function dsp(m){return S.pu=="ft"?fmt(m*3.28084,0)+" ft":fmt(m,m<10&&m%1?1:0)+" m"}
function loadPd(){try{var j=JSON.parse(localStorage.getItem("gp_pd"));if(j&&Array.isArray(j.rows))return j}catch(e){}return{d:5,rows:[]}}

  return{n:n,pu:pu,sg:sgt,by:Object.keys(by).map(function(k){return by[k]}).sort(function(a,b){return a.d-b.d})}}
